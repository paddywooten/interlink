name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exactly the installers each OS's one-click script in packaging/
          # produces, so CI and the docs can never drift apart.
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: msi
          - platform: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: linux build deps (webkit2gtk etc.)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libasound2-dev build-essential curl wget file libxdo-dev

      - name: install frontend deps
        working-directory: desktop
        run: npm ci

      - name: frontend typecheck + build
        working-directory: desktop
        run: npm run build

      - name: rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: build tauri app (${{ matrix.bundles }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          # The same bundles the OS's packaging/ script builds.
          args: --bundles ${{ matrix.bundles }}
          # On a v* tag, attach installers to a draft release automatically.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('InterLink {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interlink-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: setup android sdk
        uses: android-actions/setup-android@v3
        with:
          # cmdline-tools 16 dropped the legacy "tools" package the action used to
          # install by default (it now errors with "Failed to find package 'tools'").
          # Install a still-valid package; Gradle auto-downloads the SDK 35
          # platform/build-tools it needs once licenses are accepted.
          packages: "platform-tools"

      - name: gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: crypto unit tests (RFC vectors)
        working-directory: android
        run: ./gradlew testDebugUnitTest --console=plain

      - name: build debug apk
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: interlink-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
