[package]
name = "interlink"
version = "0.1.0"
description = "InterLink — Android ↔ Laptop interconnectivity"
authors = ["InterLink"]
edition = "2021"

[lib]
name = "interlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
# Native popups so phone events still surface with the window minimised.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
# Ephemeral P-256 ECDH for approve-to-pair (pair.rs). P-256 because Android's
# platform crypto does it natively — no extra dependency on the phone side.
p256 = { version = "0.13", default-features = false, features = ["ecdh", "std"] }
base64 = "0.22"
cpal = "0.15"
thiserror = "2"
rfd = "0.15"
log = "0.4"
env_logger = "0.11"

# Native drag-out: an HTML dragstart cannot hand a real file to the OS from a
# webview, so the drag command in commands.rs starts a native drag itself:
# `drag` on Windows (OLE/DoDragDrop) and macOS (NSDraggingSession); directly
# on GTK on Linux, because `drag` offers GTK's portal file-transfer targets,
# which Plasma consumes on drag-enter and then fails to read at the drop.
[target.'cfg(not(target_os = "linux"))'.dependencies]
drag = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
